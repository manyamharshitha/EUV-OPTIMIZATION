# nginx sits in front of the Python process for a specific reason: serve.py
# uses the standard library's http.server, which Python's own documentation
# says is not intended for production. It has no rate limiting, no request
# size caps, and no protection against slow-client attacks. nginx handles the
# hostile side of the internet and speaks to the app over loopback.

# Rate limit: the optimizer does real work per /api/run, so a burst of
# requests is expensive. 10 r/s with a burst of 20 is generous for a demo and
# still stops a trivial flood.
limit_req_zone $binary_remote_addr zone=euv_api:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cap request bodies. Every route is a GET; nothing legitimate is large.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Do not advertise the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        limit_req zone=euv_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/run can take a couple of seconds on a t3.micro; the app's own
        # worst-case budget is 3s, so allow headroom without hanging forever.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
